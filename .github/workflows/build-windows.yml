name: Build Scribe (installeur Windows)

# Fabrique l'installeur .exe autonome (service + Tesseract + Ghostscript).
# Se lance manuellement, ou à chaque push.

on:
  workflow_dispatch:
  push:
    branches: ["**"]

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dépendances Python (+ PyInstaller)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Compiler l'exécutable (PyInstaller)
        run: pyinstaller --noconfirm --workpath dist/_pyiwork build/scribe.spec

      - name: Vérifier que l'exécutable démarre réellement
        timeout-minutes: 3
        run: |
          # Lance l'exe gelé : --init-config exerce tout le chargement du
          # paquet 'scribe' (et watchdog) sans dépendre des moteurs OCR.
          # Échoue si le paquet n'est pas embarqué (ModuleNotFoundError).
          $exe = "dist/scribe/scribe.exe"
          if (-not (Test-Path $exe)) { throw "Exécutable introuvable : $exe" }
          Remove-Item "$env:ProgramData\Scribe\config.toml" -ErrorAction SilentlyContinue
          Start-Process -FilePath $exe -ArgumentList "--init-config","$env:TEMP\scribe-selftest" -Wait -PassThru | Out-Null
          if (-not (Test-Path "$env:ProgramData\Scribe\config.toml")) {
            throw "scribe.exe n'a pas généré la configuration : le paquet 'scribe' n'est pas embarqué correctement."
          }
          Write-Host "OK : scribe.exe démarre et génère sa configuration."

      - name: Installer les moteurs OCR (Tesseract, Ghostscript, NSSM)
        run: |
          choco install tesseract ghostscript nssm --no-progress -y
          # Rafraîchit le PATH pour la même session PowerShell.
          Import-Module "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1"
          Update-SessionEnvironment

      - name: Préparer le dossier vendor
        run: powershell -ExecutionPolicy Bypass -File build/fetch-vendor.ps1

      - name: Installer Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Construire l'installeur
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "build\installer.iss"

      - name: Publier l'installeur (artefact téléchargeable)
        uses: actions/upload-artifact@v4
        with:
          name: Scribe-Setup
          path: dist/installer/*.exe
          if-no-files-found: error
