[project]
name = "scribe"
version = "1.0.0"
description = "Service de fond de reconnaissance de texte (OCR) sur PDF."
requires-python = ">=3.11"
dependencies = [
    "ocrmypdf>=16.0.0",
    "watchdog>=4.0.0",
]

[project.scripts]
scribe = "scribe.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["scribe"]
